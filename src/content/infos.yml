studio: |
  L’atelier, créé en 2000 par Nicolas Hubert, exerce ses compétences dans des projets liés à la culture (musées, expositions, théâtres), au design et à l’édition.
  Dans ce cadre, nous élaborons des identités visuelles d’expositions, nous concevons des mises en page de beaux livres et nous mettons en forme des campagnes de communication pour de nombreuses institutions culturelles en France et à l’étranger, avec une attention particulière portée à la typographie.
