studio: |
  Créé fin 2000, le studio – composé de Nicolas Hubert et d’Amélina Bouchez, diplômé·e de l’École nationale supérieure des Arts décoratifs de Paris – travaille dans les domaines de la culture (musées, expositions, théâtres), de l’édition et du design.
  Nous élaborons des identités visuelles d’expositions, nous concevons des mises en page de beaux livres et nous mettons en forme des campagnes de communication pour de grandes institutions culturelles en France et à l’étranger avec une attention particulière portée à la typographie.
